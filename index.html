<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1c2c" />
    <title>Lyriq OS</title>
    <meta name="description" content="Portfolio of Lyriqalc" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Copies locales (optionnel) : mets les .ttf dans fonts/ . Si Google Fonts marche, il est utilisé en priorité. */
      @font-face {
        font-family: "PS2P Local";
        src: url("fonts/PressStart2P-Regular.ttf") format("truetype");
        font-display: swap;
      }
      @font-face {
        font-family: "VT323 Local";
        src: url("fonts/VT323-Regular.ttf") format("truetype");
        font-display: swap;
      }
      :root {
        --k: #1a1c2c;
        --w: #f4f4f4;
        --y: #ffcd75;
        --o: #ef7d57;
        --r: #b13e53;
        --p: #5d275d;
        --g: #a7f070;
        --G: #38b764;
        --t: #257179;
        --b: #3b5dc9;
        --c: #73eff7;
        --B: #41a6f6;
        --s: #94b0c2;
        --S: #566c86;
        --d: #333c57;
        --n: #29366f;
        --panel: #dfe6ee;
        --px:
          "Press Start 2P", "PS2P Local", "Noto Sans", "Segoe UI", sans-serif;
        --vt: "VT323", "VT323 Local", "Noto Sans", "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--k);
        color: var(--k);
        font-family: var(--vt);
        font-size: 22px;
        line-height: 1.15;
        -webkit-font-smoothing: none;
        user-select: none;
      }
      button,
      select {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .spr {
        display: block;
        image-rendering: pixelated;
      }
      img {
        image-rendering: auto;
      }
      :focus-visible {
        outline: 3px dashed var(--c);
        outline-offset: 2px;
      }
      .crt {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 99999;
        background: repeating-linear-gradient(#0000 0 3px, #0000001f 3px 4px);
      }

      /* BOOT */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--k);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        cursor: pointer;
        transition: opacity 0.4s steps(4);
        text-align: center;
        padding: 20px;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot h1 {
        font-family: var(--px);
        font-size: clamp(1.4rem, 6vw, 2.6rem);
        color: var(--y);
        text-shadow: 4px 4px 0 var(--r);
      }
      #seg {
        display: flex;
        gap: 4px;
        padding: 6px;
        border: 4px solid var(--w);
      }
      #seg i {
        width: 16px;
        height: 22px;
        background: var(--d);
      }
      #seg i.on {
        background: var(--g);
      }
      #boot p {
        font-size: 1.2rem;
        color: var(--s);
      }
      #boot .blink {
        animation: bl 1s steps(2) infinite;
      }
      @keyframes bl {
        50% {
          opacity: 0;
        }
      }

      /* TOP BAR */
      #bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 40px;
        background: var(--k);
        border-bottom: 4px solid var(--w);
        z-index: 500;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        font-family: var(--px);
        font-size: 10px;
        color: var(--w);
        gap: 10px;
      }
      #bar .brand {
        color: var(--y);
        white-space: nowrap;
      }
      #act {
        color: var(--s);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        flex: 1;
        text-align: center;
      }
      #bar .right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .lang-picker {
        position: relative;
        z-index: 700;
        font-family: var(--px);
        font-size: 8px;
      }
      .lang-trigger {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 112px;
        padding: 6px 8px;
        color: var(--w);
        background: var(--k);
        border: 3px solid var(--w);
        box-shadow: 3px 3px 0 #0008;
        font-family: var(--px);
        font-size: 8px;
      }
      .flag {
        font-family:
          "Noto Color Emoji", "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
        line-height: 1;
      }
      .lang-trigger .flag {
        font-size: 17px;
      }
      .lang-menu {
        position: absolute;
        top: calc(100% + 7px);
        right: 0;
        display: none;
        width: 190px;
        max-height: 280px;
        overflow: auto;
        padding: 5px;
        background: var(--k);
        border: 3px solid var(--w);
        box-shadow: 5px 5px 0 #0009;
      }
      .lang-picker.open .lang-menu {
        display: block;
        animation: menu-in 0.12s steps(3);
      }
      @keyframes menu-in {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .lang-option {
        display: flex;
        align-items: center;
        width: 100%;
        gap: 10px;
        padding: 8px;
        color: var(--w);
        text-align: left;
        font-family: var(--px);
        font-size: 8px;
        line-height: 1.8;
      }
      .lang-option:hover,
      .lang-option.active {
        color: var(--k);
        background: var(--y);
      }
      .lang-option .flag {
        width: 24px;
        font-size: 18px;
        text-align: center;
      }
      #tr-state {
        color: var(--y);
        font-size: 8px;
        display: none;
      }
      #tr-state.on {
        display: inline;
        animation: bl 0.8s steps(2) infinite;
      }
      #clock {
        min-width: 50px;
        text-align: right;
      }

      /* DESKTOP */
      #desk {
        position: fixed;
        inset: 40px 0 96px 0;
        overflow: hidden;
        background: linear-gradient(
          #1a1c2c 0 20%,
          #29366f 20% 38%,
          #5d275d 38% 54%,
          #b13e53 54% 70%,
          #ef7d57 70% 84%,
          #ffcd75 84% 100%
        );
      }
      #desk .stars {
        position: absolute;
        top: 30px;
        left: 30px;
        width: 4px;
        height: 4px;
        background: #fff;
        opacity: 0.9;
        pointer-events: none;
        box-shadow:
          120px 20px #fff,
          260px 60px #ffcd75,
          380px 10px #fff,
          520px 80px #fff,
          640px 30px #73eff7,
          780px 70px #fff,
          900px 20px #fff,
          1040px 90px #ffcd75,
          1180px 40px #fff,
          1320px 15px #fff,
          1460px 75px #73eff7,
          70px 100px #fff,
          200px 130px #fff,
          330px 150px #fff,
          470px 120px #fff,
          600px 140px #fff,
          860px 130px #fff,
          1000px 150px #fff,
          1250px 120px #fff;
      }
      #icons {
        position: absolute;
        inset: 0;
        padding: 18px;
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 18px;
      }
      .dicon {
        width: 104px;
        text-align: center;
        color: var(--w);
        text-shadow: 2px 2px 0 var(--k);
        font-size: 24px;
      }
      .tile {
        width: 68px;
        height: 68px;
        margin: 0 auto 6px;
        background: var(--w);
        border: 4px solid var(--k);
        box-shadow: 5px 5px 0 var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.08s steps(2);
      }
      .dicon:hover .tile {
        background: var(--y);
        transform: translate(-2px, -2px);
      }
      .dicon:active .tile {
        transform: translate(3px, 3px);
        box-shadow: 2px 2px 0 var(--k);
      }

      /* WINDOWS */
      .win {
        position: absolute;
        display: none;
        flex-direction: column;
        background: var(--w);
        border: 4px solid var(--k);
        box-shadow: 8px 8px 0 #0009;
        max-width: calc(100% - 12px);
        max-height: calc(100% - 12px);
        min-width: 280px;
        min-height: 220px;
        resize: both;
        overflow: hidden;
      }
      .win.open {
        display: flex;
      }
      .title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 10px;
        background: var(--tc);
        color: var(--w);
        font-family: var(--px);
        font-size: 10px;
        cursor: grab;
        touch-action: none;
        border-bottom: 4px solid var(--k);
      }
      .title:active {
        cursor: grabbing;
      }
      .ctl {
        display: flex;
        gap: 6px;
      }
      .ctl button {
        width: 24px;
        height: 24px;
        background: var(--w);
        color: var(--k);
        border: 3px solid var(--k);
        font-family: var(--px);
        font-size: 9px;
        box-shadow: 2px 2px 0 var(--k);
      }
      .ctl button:hover {
        background: var(--y);
      }
      .ctl button:active {
        transform: translate(2px, 2px);
        box-shadow: none;
      }
      .body {
        flex: 1;
        min-height: 0;
        padding: 18px;
        overflow: auto;
        user-select: text;
      }
      h2.px {
        font-family: var(--px);
        font-size: 14px;
        line-height: 1.5;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 14px;
        background: var(--y);
        color: var(--k);
        border: 4px solid var(--k);
        box-shadow: 4px 4px 0 var(--k);
        font-family: var(--px);
        font-size: 9px;
        line-height: 1.4;
        transition: transform 0.06s steps(2);
      }
      .btn:hover {
        transform: translate(-1px, -1px);
        background: #ffe0a6;
      }
      .btn:active {
        transform: translate(4px, 4px);
        box-shadow: 0 0 0 var(--k);
      }
      .btn.pri {
        background: var(--b);
        color: var(--w);
      }
      .btn.pri:hover {
        background: var(--B);
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      /* Discord card */
      .dc {
        border: 4px solid var(--k);
        background: var(--panel);
        box-shadow: 4px 4px 0 var(--k);
      }
      .banner {
        position: relative;
        flex: 0 0 84px;
        width: 100%;
        height: 84px;
        min-height: 84px;
        background: conic-gradient(
            #3b5dc9 25%,
            #2f4ba8 0 50%,
            #3b5dc9 0 75%,
            #2f4ba8 0
          )
          0 0/16px 16px;
        border-bottom: 4px solid var(--k);
        overflow: hidden;
      }
      .banner img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }
      .dcin {
        padding: 0 18px 18px;
      }
      .av {
        position: relative;
        width: 92px;
        height: 92px;
        margin-top: -46px;
        background: var(--s);
        border: 4px solid var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
        isolation: isolate;
        overflow: visible;
      }
      .av img.avatar-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }
      .av .avatar-decoration {
        position: absolute;
        z-index: 3;
        inset: -17px;
        width: calc(100% + 34px);
        height: calc(100% + 34px);
        object-fit: contain;
        pointer-events: none;
      }
      .dot {
        position: absolute;
        z-index: 4;
        right: -12px;
        bottom: -12px;
        width: 24px;
        height: 24px;
        border: 4px solid var(--k);
        background: var(--S);
      }
      .s-online {
        background: var(--G);
      }
      .s-idle {
        background: var(--y);
      }
      .s-dnd {
        background: var(--r);
      }
      .s-offline {
        background: var(--S);
      }
      .dcin h2 {
        margin-top: 16px;
        font-family: var(--px);
        font-size: 14px;
        line-height: 1.4;
      }
      .hdl {
        color: var(--S);
        font-size: 24px;
      }
      .stt {
        margin-top: 8px;
        font-size: 22px;
      }
      .bio {
        margin-top: 12px;
        font-size: 24px;
        line-height: 1.2;
        padding: 10px;
        background: var(--w);
        border: 3px solid var(--k);
      }
      .dc-nameplate {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        max-width: 100%;
        margin-top: 10px;
        padding: 5px 8px;
        color: var(--w);
        background: var(--k);
        border: 3px solid var(--k);
        font-size: 18px;
      }
      .dc-nameplate img {
        display: block;
        width: 100%;
        max-width: 280px;
        max-height: 74px;
        object-fit: contain;
      }
      .dc-section-title {
        margin-top: 16px;
        margin-bottom: 7px;
        font-family: var(--px);
        font-size: 9px;
      }
      .dc-activities {
        display: grid;
        gap: 8px;
        margin-top: 8px;
      }
      .dc-activity {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        background: var(--w);
        border: 3px solid var(--k);
        font-size: 21px;
      }
      .dc-activity img {
        width: 42px;
        height: 42px;
        flex: none;
        object-fit: cover;
        border: 2px solid var(--k);
      }
      .dc-activity small {
        display: block;
        color: var(--S);
        font-size: 18px;
      }
      .dc-activity-copy {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .dc-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .dc-meta span {
        padding: 4px 7px;
        background: var(--panel);
        border: 2px solid var(--k);
        font-size: 17px;
      }

      /* Social */
      .soc {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .soc a {
        display: grid;
        grid-template-columns: 52px 1fr 24px;
        gap: 14px;
        align-items: center;
        padding: 10px 14px 10px 10px;
        background: var(--w);
        border: 4px solid var(--k);
        box-shadow: 5px 5px 0 var(--k);
        transition: transform 0.06s steps(2);
      }
      .soc a:hover {
        background: var(--y);
        transform: translate(-2px, -2px);
      }
      .soc a:active {
        transform: translate(4px, 4px);
        box-shadow: 0 0 0 var(--k);
      }
      .soc .ic {
        width: 52px;
        height: 52px;
        background: var(--panel);
        border: 3px solid var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .soc b {
        display: block;
        font-family: var(--px);
        font-size: 10px;
        font-weight: 400;
        margin-bottom: 5px;
      }
      .soc small {
        font-size: 20px;
        color: var(--S);
      }
      .soc .ar {
        font-family: var(--px);
        font-size: 12px;
      }

      /* About */
      .about {
        display: flex;
        gap: 18px;
        align-items: flex-start;
      }
      .pfp {
        position: relative;
        flex: none;
        width: 108px;
        height: 108px;
        background: var(--s);
        border: 4px solid var(--k);
        box-shadow: 4px 4px 0 var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pfp img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .tag {
        padding: 2px 8px;
        background: var(--g);
        border: 3px solid var(--k);
        font-size: 20px;
      }
      .txt p {
        font-size: 24px;
        line-height: 1.2;
        margin-top: 12px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 12px;
        margin-top: 20px;
      }
      .stat {
        background: var(--panel);
        border: 3px solid var(--k);
        padding: 10px;
        text-align: center;
      }
      .stat b {
        display: block;
        font-family: var(--px);
        font-weight: 400;
        font-size: 14px;
        color: var(--r);
        margin-bottom: 8px;
      }
      .stat small {
        font-size: 20px;
        color: var(--S);
        text-transform: uppercase;
      }

      /* Works */
      .gal {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
      }
      .gi {
        display: block;
        text-align: start;
        background: var(--w);
        border: 4px solid var(--k);
        box-shadow: 4px 4px 0 var(--k);
        transition: transform 0.06s steps(2);
      }
      .gi:hover {
        transform: translate(-2px, -2px);
        background: var(--y);
      }
      .gi:active {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 var(--k);
      }
      .th {
        position: relative;
        aspect-ratio: 4/3;
        background: var(--s);
        border-bottom: 4px solid var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .th img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .gi span {
        display: block;
        padding: 8px 10px 2px;
        font-family: var(--px);
        font-size: 9px;
        line-height: 1.5;
      }
      .gi small {
        display: block;
        padding: 0 10px 8px;
        font-size: 20px;
        color: var(--S);
      }

      /* Skills */
      .sk {
        margin-bottom: 22px;
      }
      .sk .h {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
        gap: 10px;
      }
      .sk .h b {
        font-family: var(--px);
        font-weight: 400;
        font-size: 10px;
      }
      .sk .h small {
        font-size: 20px;
        color: var(--S);
      }
      .blocks {
        display: flex;
        gap: 4px;
        padding: 5px;
        background: var(--k);
      }
      .blocks i {
        flex: 1;
        height: 18px;
        background: var(--d);
      }
      .blocks i.on {
        background: var(--g);
      }
      .blocks i.on.h2 {
        background: var(--y);
      }

      /* Language overlay */
      #lang-loading {
        position: fixed;
        inset: 0;
        z-index: 9500;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #1a1c2cf2;
        color: var(--w);
        text-align: center;
      }
      #lang-loading.open {
        display: flex;
      }
      .loading-card {
        width: min(420px, 100%);
        padding: 26px;
        background: var(--k);
        border: 4px solid var(--w);
        box-shadow: 8px 8px 0 #0009;
      }
      .loading-card h2 {
        color: var(--y);
        font-family: var(--px);
        font-size: 12px;
        line-height: 1.7;
      }
      .loading-card p {
        margin-top: 14px;
        color: var(--s);
        font-size: 25px;
      }
      .loading-track {
        display: flex;
        gap: 5px;
        margin-top: 22px;
        padding: 6px;
        border: 3px solid var(--w);
      }
      .loading-track i {
        flex: 1;
        height: 18px;
        background: var(--d);
        animation: loading-pixel 0.9s steps(2) infinite;
      }
      .loading-track i:nth-child(2) {
        animation-delay: 0.08s;
      }
      .loading-track i:nth-child(3) {
        animation-delay: 0.16s;
      }
      .loading-track i:nth-child(4) {
        animation-delay: 0.24s;
      }
      .loading-track i:nth-child(5) {
        animation-delay: 0.32s;
      }
      .loading-track i:nth-child(6) {
        animation-delay: 0.4s;
      }
      .loading-track i:nth-child(7) {
        animation-delay: 0.48s;
      }
      .loading-track i:nth-child(8) {
        animation-delay: 0.56s;
      }
      @keyframes loading-pixel {
        0%,
        100% {
          background: var(--d);
        }
        50% {
          background: var(--g);
        }
      }

      /* Viewer */
      #viewer {
        position: fixed;
        inset: 0;
        z-index: 8000;
        background: #1a1c2ce6;
        display: none;
        align-items: center;
        justify-content: center;

      /* =========================================================
   Core
   ========================================================= */
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const store = {
        get(k) {
          try {

        },
        set(k, v) {
          try {

          } catch (e) {}
        },
      };
      async function fetchJSON(url, ms = 6000) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), ms);
        try {
          const r = await fetch(url, { signal: ctrl.signal });
          if (!r.ok) throw new Error("HTTP " + r.status);
          return await r.json();
        } finally {
          clearTimeout(timer);
        }
      }

      /* ---------- Pixel fonts : on attend qu'elles soient chargées puis on re-render ---------- */
      function loadFonts() {
        if (!document.fonts || !document.fonts.load) return;
        const tries = [
          ['10px "Press Start 2P"', '10px "PS2P Local"'],
          ['22px "VT323"', '22px "VT323 Local"'],
        ];
        tries.forEach(([google, local]) => {
          document.fonts.load(google, "Aa").catch(() => {});
          document.fonts.load(local, "Aa").catch(() => {});
        });
      }

      /* ---------- Translation (Google Translate + fallback MyMemory) ---------- */
      const CODES = LANGS.map((l) => l[0]);
      let lang = "en",
        dict = {},
        trToken = 0;

      function detectLang() {
        const saved = store.get("lang");
        if (saved && CODES.includes(saved)) return saved;
        const nav = (navigator.language || "en").toLowerCase();
        return (
          CODES.find((c) => c.toLowerCase() === nav) ||
          CODES.find((c) => c.toLowerCase() === nav.split("-")[0]) ||
          "en"
        );
      }

      /* Liste des textes anglais à traduire : uniquement depuis CONFIG et UI, jamais depuis le DOM */
      function sourceStrings() {
        const set = new Set(Object.values(UI));
        const add = (s) => s && set.add(String(s).trim());
        add(CONFIG.role);
        add(CONFIG.discord.bio);
        CONFIG.socials.forEach((s) => add(s.label));
        CONFIG.tags.forEach(add);
        CONFIG.about.forEach(add);
        CONFIG.stats.forEach((s) => add(s.label));
        CONFIG.skills.forEach((s) => (add(s.name), add(s.note)));
        CONFIG.works.forEach((w) => (add(w.title), add(w.desc)));
        return [...set].filter((s) => /[A-Za-z]{2}/.test(s));
      }

      async function googleTranslate(text, to) {
        const url =
          "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&dt=t&tl=" +
          encodeURIComponent(to) +
          "&q=" +
          encodeURIComponent(text);
        for (let a = 0; a < 3; a++) {
          try {
            const j = await fetchJSON(url, 8000);
            return j[0].map((x) => x[0]).join("");
          } catch (e) {
            await new Promise((r) => setTimeout(r, 400 * (a + 1)));
          }
        }
        const j = await fetchJSON(
          "https://api.mymemory.translated.net/get?q=" +
            encodeURIComponent(text) +
            "&langpair=en|" +
            encodeURIComponent(to),
          8000,
        );
        if (!j.responseData || !j.responseData.translatedText)
          throw new Error("translate fail");
        return j.responseData.translatedText;
      }

      const t = (s) => {
        if (s == null || s === "") return "";
        if (lang === "en") return s;
        return (OVERRIDES[lang] && OVERRIDES[lang][s]) || dict[s] || s;
      };
      const ui = (k) => t(UI[k]);

      const languageOverlay = $("#lang-loading");
      let languageOverlayTimer;
      function showLanguageLoading() {
        clearTimeout(languageOverlayTimer);
        languageOverlay.classList.add("open");
      }
      function hideLanguageLoading() {
        languageOverlay.classList.remove("open");
      }

      async function setLang(l, animate = true) {
        const token = ++trToken;
        if (animate && l !== lang) showLanguageLoading();
        lang = l;
        store.set("lang", l);
        document.documentElement.lang = l;
        document.documentElement.dir = RTL.includes(l) ? "rtl" : "ltr";
        dict = {};
        if (l !== "en") {
          try {
            dict = JSON.parse(store.get("tr_" + l) || "{}");
          } catch (e) {}
        }
        const mine = dict;
        render();
        const todo =
          l === "en"
            ? []
            : sourceStrings().filter(
                (s) => !mine[s] && !(OVERRIDES[l] && OVERRIDES[l][s]),
              );
        const flag = $("#tr-state");
        try {
          if (todo.length) {
            flag.classList.add("on");
            let i = 0;
            const worker = async () => {
              while (i < todo.length && token === trToken) {
                const s = todo[i++];
                try {
                  mine[s] = await googleTranslate(s, l);
                } catch (e) {}
              }
            };
            await Promise.all([worker(), worker(), worker()]);
            if (token !== trToken) return;
            store.set("tr_" + l, JSON.stringify(mine));
            render();
          }
        } finally {
          if (token === trToken) {
            flag.classList.remove("on");
            languageOverlayTimer = setTimeout(hideLanguageLoading, 300);
          }
        }

      let discordSocket = null,
        discordHeartbeat = null,
        discordReconnect = null;

      function setLive(data) {
        if (!data) return;
        const s = JSON.stringify(data);
        if (s === lastLive) return;
        lastLive = s;
        live = data;
        store.set("lanyard", s);
        fillApp("profile");

      async function loadDiscord() {
        const d = CONFIG.discord;
        if (!d.live || !/^\d{15,25}$/.test(d.id)) return;
        const rest = fetchJSON("https://api.lanyard.rest/v1/users/" + d.id)
          .then((j) => j.success && setLive(j.data))
          .catch(() => {});
        const look = lookup
          ? null
          : fetchJSON("https://discordlookup.mesalytic.moe/v1/user/" + d.id)
              .then((j) => {
                lookup = j;
                store.set("dlookup", JSON.stringify(j));
                fillApp("profile");
              })
              .catch(() => {});
        await Promise.all([rest, look]);
      }

      function connectLanyard() {
        if (!CONFIG.discord.live || !/^\d{15,25}$/.test(CONFIG.discord.id))
          return;
        try {
          discordSocket = new WebSocket("wss://api.lanyard.rest/socket");
          discordSocket.addEventListener("message", (event) => {
            let packet;
            try {
              packet = JSON.parse(event.data);
            } catch (e) {
              return;
            }
            if (packet.op === 1) {
              clearInterval(discordHeartbeat);
              discordHeartbeat = setInterval(() => {
                if (
                  discordSocket &&
                  discordSocket.readyState === WebSocket.OPEN
                )
                  discordSocket.send(JSON.stringify({ op: 3 }));
              }, packet.d.heartbeat_interval);
              discordSocket.send(
                JSON.stringify({
                  op: 2,
                  d: { subscribe_to_id: CONFIG.discord.id },
                }),
              );
            }
            if (
              packet.op === 0 &&
              (packet.t === "INIT_STATE" || packet.t === "PRESENCE_UPDATE")
            )
              setLive(packet.d);
          });
          discordSocket.addEventListener("close", () => {
            clearInterval(discordHeartbeat);
            clearTimeout(discordReconnect);
            discordReconnect = setTimeout(connectLanyard, 5000);
          });
          discordSocket.addEventListener("error", () => {
            if (discordSocket) discordSocket.close();
          });
        } catch (e) {
          clearTimeout(discordReconnect);
          discordReconnect = setTimeout(connectLanyard, 5000);
        }
      }

      function discordAsset(applicationId, asset) {
        if (!asset) return "";
        if (asset.startsWith("mp:external/"))
          return "https://media.discordapp.net/" + asset.slice(3);
        if (asset.startsWith("http://") || asset.startsWith("https://"))
          return asset;
        return applicationId
          ? "https://cdn.discordapp.com/app-assets/" +
              applicationId +
              "/" +
              asset +
              ".png?size=128"
          : "";
      }

        const name =
          (u && (u.global_name || u.display_name || u.username)) ||
          (lu && (lu.global_name || lu.display_name || lu.username)) ||
          d.displayName;
        const handle = (u && u.username) || (lu && lu.username) || d.username;
        let avatar = d.avatar;
        if (u && u.avatar)
          avatar = `https://cdn.discordapp.com/avatars/${d.id}/${u.avatar}.${u.avatar.startsWith("a_") ? "gif" : "png"}?size=512`;
        else if (lu && lu.avatar && lu.avatar.link) avatar = lu.avatar.link;
        const rawBanner = (lu && lu.banner) || (u && u.banner) || "";
        const bannerHash =
          typeof rawBanner === "string"
            ? rawBanner
            : rawBanner &&
              (rawBanner.id || rawBanner.hash || rawBanner.asset || "");
        const bannerLink =
          typeof rawBanner === "object" && rawBanner
            ? rawBanner.link || rawBanner.url || rawBanner.image || ""
            : "";
        const bannerValue =
          (typeof bannerLink === "string" && bannerLink) ||
          (typeof rawBanner === "string" && /^https?:\/\//i.test(rawBanner)
            ? rawBanner
            : "") ||
          (bannerHash
            ? `https://cdn.discordapp.com/banners/${d.id}/${bannerHash}.${String(bannerHash).startsWith("a_") ? "gif" : "png"}?size=1024`
            : "");
        const decoration =
          u && u.avatar_decoration_data && u.avatar_decoration_data.asset
            ? `https://cdn.discordapp.com/avatar-decoration-presets/${u.avatar_decoration_data.asset}.png?size=256`
            : "";
        const activities = (live && live.activities) || [];
        return {
          name,
          handle,
          avatar,
          banner: typeof bannerValue === "string" ? bannerValue : "",
          decoration,
          nameplate: u && u.collectibles && u.collectibles.nameplate,
          nameplateUrl:
            u &&
            u.collectibles &&
            u.collectibles.nameplate &&
            u.collectibles.nameplate.asset
              ? `https://cdn.discordapp.com/assets/collectibles/${u.collectibles.nameplate.asset}static.png`
              : "",
          guildTag:
            u && u.primary_guild && u.primary_guild.tag
              ? u.primary_guild.tag
              : "",
          status: live ? live.discord_status : "offline",
          custom: activities.find((a) => a.type === 4),
          activities: activities.filter((a) => a.type !== 4),
          spotify: live && live.listening_to_spotify ? live.spotify : null,
          bio: (lu && (lu.bio || lu.about_me)) || d.bio,
        };
      }

      function activityImage(a) {
        if (!a.assets || !a.assets.large_image) return "";
        if (a.name === "Spotify") return a.assets.large_image;
        return discordAsset(a.application_id, a.assets.large_image);
      }

      function activityMarkup(a) {
        const title = a.name || "Activity";
        const details = [a.details, a.state].filter(Boolean).join(" · ");
        const image = activityImage(a);
        return `<div class="dc-activity">${image ? `<img src="${esc(image)}" alt="" onerror="this.remove()">` : ""}<div class="dc-activity-copy"><b>${esc(title)}</b>${details ? `<small>${esc(details)}</small>` : ""}</div></div>`;
      }

      function profileBody() {
        const d = CONFIG.discord;
        const p = profileData();
        const link = `https://discord.com/users/${encodeURIComponent(d.id)}`;
        const sttTxt = d.live ? (live ? ui(p.status) : ui("loading")) : "";
        const customStatus = p.custom && p.custom.state ? p.custom.state : "";
        const statusClass = live ? "s-" + p.status : "s-offline";
        const activities = [
          ...(p.spotify
            ? [
                {
                  name: "Spotify",
                  details: p.spotify.song,
                  state: p.spotify.artist,
                  assets: { large_image: p.spotify.album_art_url },
                  application_id: "",
                },
              ]
            : []),
          ...p.activities,
        ];
        const activitySection = activities.length
          ? `<div class="dc-section-title">${esc(ui("activity"))}</div><div class="dc-activities">${activities.map(activityMarkup).join("")}</div>`
          : `<div class="dc-section-title">${esc(ui("activity"))}</div><p class="stt">${esc(ui("noActivity"))}</p>`;
        const nameplate = p.nameplate
          ? `<div class="dc-nameplate">${p.nameplateUrl ? `<img src="${esc(p.nameplateUrl)}" alt="" onerror="this.remove()">` : ""}<span>${esc(p.nameplate.label || "Discord nameplate")}</span></div>`
          : "";
        const guildTag = p.guildTag ? `<span>◆ ${esc(p.guildTag)}</span>` : "";
        return `<div class="dc"><div class="banner">${p.banner ? `<img src="${esc(p.banner)}" alt="" onerror="this.remove()">` : ""}</div><div class="dcin"><div class="av">${sprite("profile", 56)}<img class="avatar-image" src="${esc(p.avatar)}" alt="" onerror="this.remove()">${p.decoration ? `<img class="avatar-decoration" src="${esc(p.decoration)}" alt="" onerror="this.remove()">` : ""}<i class="dot ${statusClass}"></i></div><h2>${esc(p.name)}</h2><p class="hdl">@${esc(p.handle)}</p>${sttTxt ? `<p class="stt">■ ${esc(sttTxt)}${customStatus ? " — " + esc(customStatus) : ""}</p>` : ""}${nameplate}${p.bio ? `<p class="bio">${esc(t(p.bio))}</p>` : ""}${activitySection}<div class="dc-meta">${guildTag}${live && live.active_on_discord_desktop ? "<span>Desktop</span>" : ""}${live && live.active_on_discord_web ? "<span>Web</span>" : ""}${live && live.active_on_discord_mobile ? "<span>Mobile</span>" : ""}</div><div class="row"><a class="btn pri" href="${link}" target="_blank" rel="noopener">${esc(ui("open"))}</a><button class="btn" data-copy="${esc(p.handle)}">${esc(ui("copy"))}</button></div></div></div>`;
      }

      const isPlaceholder = (s) =>
        /your_|you@email|your channel/i.test(s.url + " " + s.handle);
      function socialBody() {
        return `<div class="soc">${CONFIG.socials
          .filter((s) => !isPlaceholder(s))
          .map(
            (s) => `
<a href="${esc(s.url)}" target="_blank" rel="noopener"><span class="ic">${sprite(s.icon, 36)}</span><span><b>${esc(t(s.label))}</b><small>${esc(s.handle)}</small></span><span class="ar">▶</span></a>`,
          )
          .join("")}</div>`;
      }
      function aboutBody() {
        return `<div class="about">
<div class="pfp">${sprite("profile", 64)}<img src="${esc(CONFIG.avatar)}" alt="" onerror="this.remove()"></div>
<div class="txt"><h2 class="px">${esc(CONFIG.name)}</h2><p style="color:var(--S);margin-top:6px">${esc(t(CONFIG.role))}</p>
<div class="tags">${CONFIG.tags.map((x) => `<span class="tag">${esc(t(x))}</span>`).join("")}</div></div></div>
<div class="txt">${CONFIG.about.map((p) => `<p>${esc(t(p))}</p>`).join("")}</div>
<div class="stats">${CONFIG.stats.map((s) => `<div class="stat"><b>${esc(s.value)}</b><small>${esc(t(s.label))}</small></div>`).join("")}</div>`;
      }
      function worksBody() {
        return `<div class="gal">${CONFIG.works
          .map(
            (w, i) => `
<button class="gi" data-w="${i}"><div class="th">${sprite("works", 48)}<img src="${esc(w.img)}" alt="${esc(t(w.title))}" loading="lazy" onerror="this.remove()"></div><span>${esc(t(w.title))}</span><small>${esc(t(w.desc))}</small></button>`,
          )
          .join("")}</div>`;
      }
      function skillsBody() {
        return CONFIG.skills
          .map((s) => {
            const n = Math.round(s.level / 10);
            return `<div class="sk"><div class="h"><b>${esc(t(s.name))}</b><small>${s.level}%</small></div>
<div class="blocks">${Array.from({ length: 10 }, (_, i) => `<i class="${i < n ? "on" + (i >= 7 ? " h2" : "") : ""}"></i>`).join("")}</div>
<small style="color:var(--S);font-size:20px">${esc(t(s.note))}</small></div>`;
          })
          .join("");
      }

      const APPS = [
        {
          id: "profile",
          icon: "profile",
          c: "#3b5dc9",
          w: 440,
          body: profileBody,
        },
        {
          id: "social",
          icon: "social",
          c: "#b13e53",
          w: 420,
          body: socialBody,
        },
        { id: "about", icon: "about", c: "#257179", w: 500, body: aboutBody },
        { id: "works", icon: "works", c: "#5d275d", w: 640, body: worksBody },
        {
          id: "skills",
          icon: "skills",
          c: "#29366f",
          w: 460,
          body: skillsBody,
        },
      ];

      const desk = $("#desk");
      let z = 10,
        topId = null;

      APPS.forEach((a) => {
        const el = document.createElement("section");
        el.className = "win";
        el.id = "w-" + a.id;
        el.style.setProperty("--tc", a.c);
        el.innerHTML = `<div class="title"><span class="tt"></span><span class="ctl"><button data-min aria-label="Minimize">_</button><button data-x aria-label="Close">X</button></span></div><div class="body"></div>`;
        desk.appendChild(el);
        a.el = el;
        el.addEventListener("pointerdown", () => focusApp(a.id));
        $("[data-x]", el).onclick = () => closeApp(a.id);
        $("[data-min]", el).onclick = () => closeApp(a.id);
        const head = $(".title", el);
        head.addEventListener("pointerdown", (e) => {
          if (e.target.closest("button") || innerWidth <= 700) return;
          const ox = e.clientX - el.offsetLeft,
            oy = e.clientY - el.offsetTop;
          head.setPointerCapture(e.pointerId);
          const move = (ev) => {
            el.style.left =
              Math.max(
                0,
                Math.min(ev.clientX - ox, desk.clientWidth - el.offsetWidth),
              ) + "px";
            el.style.top =
              Math.max(0, Math.min(ev.clientY - oy, desk.clientHeight - 48)) +
              "px";
          };
          const up = () => {
            head.removeEventListener("pointermove", move);
            head.removeEventListener("pointerup", up);
          };
          head.addEventListener("pointermove", move);
          head.addEventListener("pointerup", up);
        });
      });

      function fillApp(id) {
        const a = APPS.find((x) => x.id === id);
        $(".tt", a.el).textContent = ui(a.id).toUpperCase();
        const body = $(".body", a.el);
        body.dir = RTL.includes(lang) ? "rtl" : "ltr";
        const top = body.scrollTop;
        body.innerHTML = a.body();
        body.scrollTop = top;
      }
      const fillAll = () => APPS.forEach((a) => fillApp(a.id));

      function chrome() {
        $("#icons").innerHTML = APPS.map(
          (a) =>
            `<button class="dicon" data-open="${a.id}"><div class="tile">${sprite(a.icon, 44)}</div>${esc(ui(a.id))}</button>`,
        ).join("");
        $("#dock").innerHTML = APPS.map(
          (a) =>
            `<button class="dk" data-dock="${a.id}" title="${esc(ui(a.id))}" aria-label="${esc(ui(a.id))}">${sprite(a.icon, 36)}</button>`,
        ).join("");
        const sel = LANGS.find(([c]) => c === lang) || LANGS[0];
        $("#lang-flag").textContent = FLAGS[lang] || "🌐";
        $("#lang-label").textContent = sel[1];
        $("#lang-menu").innerHTML = LANGS.map(
          ([c, n]) =>
            `<button class="lang-option${c === lang ? " active" : ""}" type="button" role="menuitem" data-lang="${c}"><span class="flag">${FLAGS[c] || "🌐"}</span><span>${esc(n)}</span></button>`,
        ).join("");
        $("#bootskip").textContent = ui("skip");
        $("#loading-title").textContent = ui("changing");
        $("#loading-copy").textContent = ui("preparing");
        refresh();
      }
      const render = () => {
        fillAll();
        chrome();
        tick();
      };

      function refresh() {
        APPS.forEach((a) => {
          const d = $(`[data-dock="${a.id}"]`);
          if (d) d.classList.toggle("run", a.el.classList.contains("open"));
        });
        const cur = APPS.find(
          (a) => a.id === topId && a.el.classList.contains("open"),
        );
        $("#act").textContent = cur ? ui(cur.id).toUpperCase() : "";
      }
      function focusApp(id) {
        APPS.find((x) => x.id === id).el.style.zIndex = ++z;
        topId = id;
        refresh();
      }
      function openApp(id) {
        const a = APPS.find((x) => x.id === id);
        const el = a.el;
        if (innerWidth <= 700)
          APPS.forEach((o) => o.el.classList.remove("open"));
        if (!el.classList.contains("open") && !el.dataset.placed) {
          const W = Math.min(a.w, desk.clientWidth - 24);
          const H = Math.min(620, Math.max(260, desk.clientHeight - 40));
          el.style.width = W + "px";
          el.style.height = H + "px";
          el.style.left = Math.max(6, (desk.clientWidth - W) / 2) + "px";
          el.style.top = Math.max(6, (desk.clientHeight - H) / 2) + "px";
          el.dataset.placed = "1";
        }
        el.classList.add("open");
        focusApp(id);
      }
      function closeApp(id) {
        APPS.find((x) => x.id === id).el.classList.remove("open");
        refresh();
      }

      /* ---------- Works viewer ---------- */
      const viewer = $("#viewer");
      let cur = 0;
      function openViewer(i) {
        const n = CONFIG.works.length;
        cur = (i + n) % n;
        const w = CONFIG.works[cur];
        viewer.innerHTML = `<div class="vwin"><div class="title" style="--tc:#5d275d"><span>${esc(t(w.title)).toUpperCase()}</span><span class="ctl"><button data-vx aria-label="Close">X</button></span></div>
<div class="body"><div class="vimg"><div class="ph">${sprite("works", 96)}</div></div>
<p style="font-size:26px">${esc(t(w.desc))}</p>
<div class="row" style="margin-top:4px"><button class="btn" data-vp>${esc(ui("prev"))}</button><button class="btn" data-vn>${esc(ui("next"))}</button>${w.link ? `<a class="btn pri" href="${esc(w.link)}" target="_blank" rel="noopener">${esc(ui("visit"))}</a>` : ""}</div></div></div>`;
        const im = new Image();
        im.alt = t(w.title);
        im.onload = () => {
          const box = $(".vimg", viewer);
          if (box) {
            box.innerHTML = "";
            box.appendChild(im);
          }
        };
        im.src = w.img;
        viewer.classList.add("open");
      }
      const closeViewer = () => viewer.classList.remove("open");

      /* ---------- Events ---------- */
      function setPicker(open) {
        $("#lang-picker").classList.toggle("open", open);
        $("#lang-trigger").setAttribute("aria-expanded", String(open));
      }
      $("#lang-trigger").addEventListener("click", (e) => {
        e.stopPropagation();
        setPicker(!$("#lang-picker").classList.contains("open"));
      });

      document.addEventListener("click", (e) => {
        const g = e.target;
        let el;
        if ((el = g.closest("[data-lang]"))) {
          setPicker(false);
          if (el.dataset.lang !== lang) setLang(el.dataset.lang);
          return;
        }
        if (!g.closest("#lang-picker")) setPicker(false);
        if ((el = g.closest("[data-dock]"))) {
          const a = APPS.find((x) => x.id === el.dataset.dock);
          return a.el.classList.contains("open") && topId === a.id
            ? closeApp(a.id)
            : openApp(a.id);
        }
        if ((el = g.closest("[data-open]"))) return openApp(el.dataset.open);
        if ((el = g.closest("[data-copy]"))) {
          const txt = el.dataset.copy;
          const done = () => {
            el.textContent = ui("copied");
            setTimeout(() => (el.textContent = ui("copy")), 1500);
          };
          try {
            navigator.clipboard.writeText(txt).then(done, done);
          } catch (x) {
            done();
          }
          return;
        }
        if ((el = g.closest("[data-w]"))) return openViewer(+el.dataset.w);
        if (g.closest("[data-vp]")) return openViewer(cur - 1);
        if (g.closest("[data-vn]")) return openViewer(cur + 1);
        if (g === viewer || g.closest("[data-vx]")) closeViewer();
      });
      document.addEventListener("keydown", (e) => {
        if (viewer.classList.contains("open")) {
          if (e.key === "Escape") closeViewer();
          if (e.key === "ArrowLeft") openViewer(cur - 1);
          if (e.key === "ArrowRight") openViewer(cur + 1);
          return;
        }
        if (e.key === "Escape") {
          setPicker(false);
          if (topId) closeApp(topId);
        }
      });

      /* ---------- Clock ---------- */
      function tick() {
        let txt;
        try {
          txt = new Date().toLocaleTimeString(lang, {
            hour: "2-digit",
            minute: "2-digit",
          });
        } catch (e) {
          txt = new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
          });
        }
        $("#clock").textContent = txt;
      }
      setInterval(tick, 1000);

      /* ---------- Boot ---------- */
      const seg = $("#seg");
      seg.innerHTML = "<i></i>".repeat(12);
      let n = 0,
        done = false;
      const boot = $("#boot");
      const iv = setInterval(() => {
        n++;
        [...seg.children].slice(0, n).forEach((b) => b.classList.add("on"));
        $("#bootp").textContent = n >= 12 ? ui("ready") : ui("boot");
        if (n >= 14) endBoot();
      }, 170);
      function endBoot() {
        if (done) return;
        done = true;
        clearInterval(iv);
        boot.classList.add("hide");
        openApp("profile");
      }
      boot.addEventListener("click", endBoot);

      /* ---------- Start ---------- */
      loadFonts();
      setLang(detectLang(), false);
      loadDiscord();
      connectLanyard();
      setInterval(() => {
        if (!discordSocket || discordSocket.readyState !== WebSocket.OPEN)
          loadDiscord();
      }, 60000);
    </script>
  </body>
</html>
