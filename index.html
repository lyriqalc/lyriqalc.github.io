<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1c2c" />
    <title>Lyriq OS</title>
    <meta name="description" content="Portfolio of Lyriqalc" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --k: #1a1c2c;
        --w: #f4f4f4;
        --y: #ffcd75;
        --o: #ef7d57;
        --r: #b13e53;
        --p: #5d275d;
        --g: #a7f070;
        --G: #38b764;
        --t: #257179;
        --b: #3b5dc9;
        --c: #73eff7;
        --B: #41a6f6;
        --s: #94b0c2;
        --S: #566c86;
        --d: #333c57;
        --n: #29366f;
        --panel: #dfe6ee;
        --px: "Press Start 2P", ui-monospace, monospace;
        --vt: "VT323", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--k);
        color: var(--k);
        font-family: var(--vt);
        font-size: 22px;
        line-height: 1.15;
        -webkit-font-smoothing: none;
        font-smooth: never;
        user-select: none;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .spr {
        display: block;
        image-rendering: pixelated;
      }
      img {
        image-rendering: auto;
      }

      /* ---------- CRT overlay ---------- */
      .crt {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 99999;
        background: repeating-linear-gradient(#0000 0 3px, #0000001f 3px 4px);
      }

      /* ---------- BOOT ---------- */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--k);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        cursor: pointer;
        transition: opacity 0.4s steps(4);
        text-align: center;
        padding: 20px;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot h1 {
        font-family: var(--px);
        font-size: clamp(1.4rem, 6vw, 2.6rem);
        color: var(--y);
        text-shadow: 4px 4px 0 var(--r);
      }
      #seg {
        display: flex;
        gap: 4px;
        padding: 6px;
        border: 4px solid var(--w);
      }
      #seg i {
        width: 16px;
        height: 22px;
        background: var(--d);
      }
      #seg i.on {
        background: var(--g);
      }
      #boot p {
        font-size: 1.2rem;
        color: var(--s);
      }
      #boot .blink {
        animation: bl 1s steps(2) infinite;
      }
      @keyframes bl {
        50% {
          opacity: 0;
        }
      }

      /* ---------- TOP BAR ---------- */
      #bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 40px;
        background: var(--k);
        border-bottom: 4px solid var(--w);
        z-index: 500;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        font-family: var(--px);
        font-size: 10px;
        color: var(--w);
        gap: 10px;
      }
      #bar .brand {
        color: var(--y);
        white-space: nowrap;
      }
      #act {
        color: var(--s);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        flex: 1;
        text-align: center;
      }
      #bar .right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #lang {
        display: flex;
        border: 3px solid var(--w);
      }
      #lang button {
        padding: 5px 8px;
        font-family: var(--px);
        font-size: 9px;
        color: var(--w);
      }
      #lang button.on {
        background: var(--y);
        color: var(--k);
      }
      #clock {
        min-width: 50px;
        text-align: right;
      }

      /* ---------- DESKTOP ---------- */
      #desk {
        position: fixed;
        inset: 40px 0 96px 0;
        overflow: hidden;
        background: linear-gradient(
          #1a1c2c 0 20%,
          #29366f 20% 38%,
          #5d275d 38% 54%,
          #b13e53 54% 70%,
          #ef7d57 70% 84%,
          #ffcd75 84% 100%
        );
      }
      #desk .stars {
        position: absolute;
        top: 30px;
        left: 30px;
        width: 4px;
        height: 4px;
        background: #fff;
        opacity: 0.9;
        box-shadow:
          120px 20px #fff,
          260px 60px #ffcd75,
          380px 10px #fff,
          520px 80px #fff,
          640px 30px #73eff7,
          780px 70px #fff,
          900px 20px #fff,
          1040px 90px #ffcd75,
          1180px 40px #fff,
          1320px 15px #fff,
          1460px 75px #73eff7,
          70px 100px #fff,
          200px 130px #fff,
          330px 150px #fff,
          470px 120px #fff,
          600px 140px #fff,
          860px 130px #fff,
          1000px 150px #fff,
          1250px 120px #fff;
        pointer-events: none;
      }
      #icons {
        position: absolute;
        inset: 0;
        padding: 18px;
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 18px;
      }
      .dicon {
        width: 104px;
        text-align: center;
        color: var(--w);
        text-shadow: 2px 2px 0 var(--k);
        font-size: 24px;
      }
      .tile {
        width: 68px;
        height: 68px;
        margin: 0 auto 6px;
        background: var(--w);
        border: 4px solid var(--k);
        box-shadow: 5px 5px 0 var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.08s steps(2);
      }
      .dicon:hover .tile {
        background: var(--y);
        transform: translate(-2px, -2px);
      }
      .dicon:active .tile {
        transform: translate(3px, 3px);
        box-shadow: 2px 2px 0 var(--k);
      }

      /* ---------- WINDOWS ---------- */
      .win {
        position: absolute;
        display: none;
        flex-direction: column;
        background: var(--w);
        border: 4px solid var(--k);
        box-shadow: 8px 8px 0 #0009;
        max-width: calc(100% - 12px);
        max-height: calc(100% - 12px);
      }
      .win.open {
        display: flex;
      }
      .title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 10px;
        background: var(--tc);
        color: var(--w);
        font-family: var(--px);
        font-size: 10px;
        cursor: grab;
        touch-action: none;
        border-bottom: 4px solid var(--k);
      }
      .title:active {
        cursor: grabbing;
      }
      .ctl {
        display: flex;
        gap: 6px;
      }
      .ctl button {
        width: 24px;
        height: 24px;
        background: var(--w);
        color: var(--k);
        border: 3px solid var(--k);
        font-family: var(--px);
        font-size: 9px;
        box-shadow: 2px 2px 0 var(--k);
      }
      .ctl button:hover {
        background: var(--y);
      }
      .ctl button:active {
        transform: translate(2px, 2px);
        box-shadow: none;
      }
      .body {
        padding: 18px;
        overflow: auto;
        user-select: text;
      }
      h2.px {
        font-family: var(--px);
        font-size: 14px;
        line-height: 1.5;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 14px;
        background: var(--y);
        color: var(--k);
        border: 4px solid var(--k);
        box-shadow: 4px 4px 0 var(--k);
        font-family: var(--px);
        font-size: 9px;
        line-height: 1.4;
        transition: transform 0.06s steps(2);
      }
      .btn:hover {
        transform: translate(-1px, -1px);
        background: #ffe0a6;
      }
      .btn:active {
        transform: translate(4px, 4px);
        box-shadow: 0 0 0 var(--k);
      }
      .btn.pri {
        background: var(--b);
        color: var(--w);
      }
      .btn.pri:hover {
        background: var(--B);
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      /* Discord card */
      .dc {
        border: 4px solid var(--k);
        background: var(--panel);
        box-shadow: 4px 4px 0 var(--k);
      }
      .banner {
        height: 74px;
        background: conic-gradient(
            #3b5dc9 25%,
            #2f4ba8 0 50%,
            #3b5dc9 0 75%,
            #2f4ba8 0
          )
          0 0/16px 16px;
        border-bottom: 4px solid var(--k);
      }
      .dcin {
        padding: 0 18px 18px;
      }
      .av {
        position: relative;
        width: 92px;
        height: 92px;
        margin-top: -46px;
        background: var(--s);
        border: 4px solid var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .av img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .dot {
        position: absolute;
        right: -12px;
        bottom: -12px;
        width: 24px;
        height: 24px;
        border: 4px solid var(--k);
        background: var(--S);
      }
      .s-online {
        background: var(--G);
      }
      .s-idle {
        background: var(--y);
      }
      .s-dnd {
        background: var(--r);
      }
      .s-offline {
        background: var(--S);
      }
      .dcin h2 {
        margin-top: 16px;
        font-family: var(--px);
        font-size: 14px;
        line-height: 1.4;
      }
      .hdl {
        color: var(--S);
        font-size: 24px;
      }
      .stt {
        margin-top: 8px;
        font-size: 22px;
      }
      .bio {
        margin-top: 12px;
        font-size: 24px;
        line-height: 1.2;
        padding: 10px;
        background: var(--w);
        border: 3px solid var(--k);
      }

      /* Social */
      .soc {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .soc a {
        display: grid;
        grid-template-columns: 52px 1fr 24px;
        gap: 14px;
        align-items: center;
        padding: 10px 14px 10px 10px;
        background: var(--w);
        border: 4px solid var(--k);
        box-shadow: 5px 5px 0 var(--k);
        transition: transform 0.06s steps(2);
      }
      .soc a:hover {
        background: var(--y);
        transform: translate(-2px, -2px);
      }
      .soc a:active {
        transform: translate(4px, 4px);
        box-shadow: 0 0 0 var(--k);
      }
      .soc .ic {
        width: 52px;
        height: 52px;
        background: var(--panel);
        border: 3px solid var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .soc b {
        display: block;
        font-family: var(--px);
        font-size: 10px;
        font-weight: 400;
        margin-bottom: 5px;
      }
      .soc small {
        font-size: 20px;
        color: var(--S);
      }
      .soc .ar {
        font-family: var(--px);
        font-size: 12px;
      }

      /* About */
      .about {
        display: flex;
        gap: 18px;
        align-items: flex-start;
      }
      .pfp {
        position: relative;
        flex: none;
        width: 108px;
        height: 108px;
        background: var(--s);
        border: 4px solid var(--k);
        box-shadow: 4px 4px 0 var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pfp img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .tag {
        padding: 2px 8px;
        background: var(--g);
        border: 3px solid var(--k);
        font-size: 20px;
      }
      .txt p {
        font-size: 24px;
        line-height: 1.2;
        margin-top: 12px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 12px;
        margin-top: 20px;
      }
      .stat {
        background: var(--panel);
        border: 3px solid var(--k);
        padding: 10px;
        text-align: center;
      }
      .stat b {
        display: block;
        font-family: var(--px);
        font-weight: 400;
        font-size: 14px;
        color: var(--r);
        margin-bottom: 8px;
      }
      .stat small {
        font-size: 20px;
        color: var(--S);
        text-transform: uppercase;
      }

      /* Works */
      .gal {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
      }
      .gi {
        display: block;
        text-align: left;
        background: var(--w);
        border: 4px solid var(--k);
        box-shadow: 4px 4px 0 var(--k);
        transition: transform 0.06s steps(2);
      }
      .gi:hover {
        transform: translate(-2px, -2px);
        background: var(--y);
      }
      .gi:active {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 var(--k);
      }
      .th {
        position: relative;
        aspect-ratio: 4/3;
        background: var(--s);
        border-bottom: 4px solid var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .th img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .gi span {
        display: block;
        padding: 8px 10px 2px;
        font-family: var(--px);
        font-size: 9px;
        line-height: 1.5;
      }
      .gi small {
        display: block;
        padding: 0 10px 8px;
        font-size: 20px;
        color: var(--S);
      }

      /* Skills */
      .sk {
        margin-bottom: 22px;
      }
      .sk .h {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
        gap: 10px;
      }
      .sk .h b {
        font-family: var(--px);
        font-weight: 400;
        font-size: 10px;
      }
      .sk .h small {
        font-size: 20px;
        color: var(--S);
      }
      .blocks {
        display: flex;
        gap: 4px;
        padding: 5px;
        background: var(--k);
      }
      .blocks i {
        flex: 1;
        height: 18px;
        background: var(--d);
      }
      .blocks i.on {
        background: var(--g);
      }
      .blocks i.on.h2 {
        background: var(--y);
      }

      /* Viewer */
      #viewer {
        position: fixed;
        inset: 0;
        z-index: 8000;
        background: #1a1c2ce6;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      #viewer.open {
        display: flex;
      }
      .vwin {
        width: min(860px, 100%);
        max-height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--w);
        border: 4px solid var(--k);
        box-shadow: 8px 8px 0 #0009;
      }
      .vwin .body {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .vimg {
        position: relative;
        background: var(--s);
        border: 4px solid var(--k);
        min-height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .vimg img {
        display: block;
        max-width: 100%;
        max-height: 52vh;
        margin: auto;
      }
      .vimg .ph {
        padding: 40px;
      }

      /* ---------- DOCK ---------- */
      #dock {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        z-index: 400;
        display: flex;
        gap: 10px;
        padding: 10px 12px 14px;
        background: var(--w);
        border: 4px solid var(--k);
        box-shadow: 6px 6px 0 #0009;
      }
      .dk {
        position: relative;
        width: 56px;
        height: 56px;
        background: var(--panel);
        border: 4px solid var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.1s steps(2);
      }
      .dk:hover {
        transform: translateY(-8px);
        background: var(--y);
      }
      .dk::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -13px;
        width: 8px;
        height: 8px;
        margin-left: -4px;
        background: var(--r);
        display: none;
      }
      .dk.run::after {
        display: block;
      }

      /* ---------- MOBILE ---------- */
      @media (max-width: 700px) {
        #bar {
          font-size: 8px;
        }
        #act {
          display: none;
        }
        #icons {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 16px 4px;
          flex-wrap: unset;
          align-content: start;
        }
        .dicon {
          width: auto;
        }
        .win {
          left: 6px !important;
          top: 6px !important;
          width: calc(100% - 12px) !important;
        }
        .title {
          cursor: default;
        }
        .about {
          flex-direction: column;
        }
        .dk {
          width: 50px;
          height: 50px;
        }
        #dock {
          gap: 8px;
          padding: 8px 10px 14px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .blink {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <h1>LYRIQ OS</h1>
      <div id="seg"></div>
      <p id="bootp">booting…</p>
      <p class="blink" id="bootskip"></p>
    </div>

    <div id="bar">
      <span class="brand">LYRIQ OS</span>
      <span id="act"></span>
      <span class="right"
        ><span id="lang"></span><span id="clock">--:--</span></span
      >
    </div>

    <div id="desk">
      <div class="stars"></div>
      <div id="icons"></div>
    </div>
    <div id="dock"></div>
    <div id="viewer"></div>
    <div class="crt"></div>

    <script>
      /* =========================================================
   ✏️  CONFIGURATION — modify everything here
   Texts are written as { en: "...", fr: "..." }
   ========================================================= */
      const CONFIG = {
        name: "Lyriqalc",
        role: {
          en: "Your role / what you do",
          fr: "Ton métier / ce que tu fais",
        },
        avatar: "img/avatar.png", // your profile picture (put it in the img/ folder)

        /* ----- PROFILE window (your Discord card) ----- */
        discord: {
          id: "YOUR_DISCORD_ID", // your numeric Discord ID (see the guide)
          username: "your_username", // shown as @your_username
          displayName: "Lyriqalc",
          avatar: "img/avatar.png", // used if live avatar isn't available
          live: false, // true = live status via Lanyard (see the guide)
          bio: {
            en: "A short sentence about you.",
            fr: "Une courte phrase sur toi.",
          },
        },

        /* ----- SOCIAL window ----- */
        /* icon: discord | x | instagram | youtube | github | mail | link */
        socials: [
          {
            icon: "discord",
            label: "Discord",
            handle: "@your_username",
            url: "https://discord.com/users/YOUR_DISCORD_ID",
          },
          {
            icon: "x",
            label: "Twitter / X",
            handle: "@your_handle",
            url: "https://twitter.com/your_handle",
          },
          {
            icon: "instagram",
            label: "Instagram",
            handle: "@your_handle",
            url: "https://instagram.com/your_handle",
          },
          {
            icon: "youtube",
            label: "YouTube",
            handle: "your channel",
            url: "https://youtube.com/@your_channel",
          },
          {
            icon: "github",
            label: "GitHub",
            handle: "lyriqalc",
            url: "https://github.com/lyriqalc",
          },
          {
            icon: "mail",
            label: "Email",
            handle: "you@email.com",
            url: "mailto:you@email.com",
          },
        ],

        /* ----- ABOUT window ----- */
        tags: [
          { en: "Skill one", fr: "Compétence un" },
          { en: "Skill two", fr: "Compétence deux" },
          { en: "Skill three", fr: "Compétence trois" },
        ],
        about: [
          {
            en: "Hi, I'm Lyriqalc! Introduce yourself here in one or two sentences.",
            fr: "Salut, moi c'est Lyriqalc ! Présente-toi ici en une ou deux phrases.",
          },
          {
            en: "Second paragraph: what you love doing and what you are looking for.",
            fr: "Deuxième paragraphe : ce que tu aimes faire et ce que tu cherches.",
          },
        ],
        stats: [
          { value: "10+", label: { en: "Projects", fr: "Projets" } },
          { value: "2021", label: { en: "Since", fr: "Depuis" } },
          { value: "17", label: { en: "Age", fr: "Âge" } },
        ],

        /* ----- SKILLS window (level 0 → 100) ----- */
        skills: [
          {
            name: { en: "Skill one", fr: "Compétence un" },
            note: { en: "A few words", fr: "Quelques mots" },
            level: 90,
          },
          {
            name: { en: "Skill two", fr: "Compétence deux" },
            note: { en: "A few words", fr: "Quelques mots" },
            level: 70,
          },
          {
            name: { en: "Skill three", fr: "Compétence trois" },
            note: { en: "A few words", fr: "Quelques mots" },

        ],
      };
      SPR.link = SPR.globe;

      function sprite(name, px) {
        const rows = SPR[name] || SPR.globe;
        let r = "";
        rows.forEach((row, y) =>
          [...row].forEach((ch, x) => {
            if (PAL[ch])
              r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[ch]}"/>`;
          }),
        );
        return `<svg class="spr" width="${px}" height="${px}" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
      }

      /* =========================================================
   Site code — you normally don't need to touch below
   ========================================================= */
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      let lang = "en";
      try {
        const s = localStorage.getItem("lang");
        if (s === "fr" || s === "en") lang = s;
      } catch (e) {}
      const t = (o) => (o && (o[lang] ?? o.en)) || "";
      const ui = (k) => UI[lang][k];

      /* --- live Discord status (optional, via Lanyard) --- */
      let live = null;

      function profileBody() {
        const d = CONFIG.discord,
          u = live && live.discord_user;
        const status = live ? live.discord_status : "offline";
        const name = (u && (u.global_name || u.username)) || d.displayName;
        const handle = (u && u.username) || d.username;
        const av =
          u && u.avatar
            ? `https://cdn.discordapp.com/avatars/${d.id}/${u.avatar}.png?size=256`
            : d.avatar;
        const custom =
          live && (live.activities || []).find((a) => a.type === 4);
        const sttTxt = d.live ? (live ? ui(status) : ui("loading")) : "";
        const link = `https://discord.com/users/${encodeURIComponent(d.id)}`;
        return `<div class="dc"><div class="banner"></div><div class="dcin">
    <div class="av">${sprite("profile", 56)}
      <img src="${esc(av)}" alt="" onerror="this.remove()">
      ${d.live ? `<i class="dot s-${esc(status)}"></i>` : ""}</div>
    <h2>${esc(name)}</h2>
    <p class="hdl">@${esc(handle)}</p>
    ${sttTxt ? `<p class="stt">■ ${esc(sttTxt)}${custom && custom.state ? " — " + esc(custom.state) : ""}</p>` : ""}
    <p class="bio">${esc(t(d.bio))}</p>
    <div class="row">
      <a class="btn pri" href="${link}" target="_blank" rel="noopener">${ui("open")}</a>
      <button class="btn" data-copy="${esc(handle)}">${ui("copy")}</button>
    </div></div></div>`;
      }
      function socialBody() {
        return `<div class="soc">${CONFIG.socials
          .map(
            (s) => `
    <a href="${esc(s.url)}" target="_blank" rel="noopener">
      <span class="ic">${sprite(s.icon, 36)}</span>
      <span><b>${esc(s.label)}</b><small>${esc(s.handle)}</small></span><span class="ar">▶</span></a>`,
          )
          .join("")}</div>`;
      }
      function aboutBody() {
        return `<div class="about">
    <div class="pfp">${sprite("profile", 64)}<img src="${esc(CONFIG.avatar)}" alt="" onerror="this.remove()"></div>
    <div class="txt"><h2 class="px">${esc(CONFIG.name)}</h2><p style="color:var(--S);margin-top:6px">${esc(t(CONFIG.role))}</p>
      <div class="tags">${CONFIG.tags.map((x) => `<span class="tag">${esc(t(x))}</span>`).join("")}</div></div></div>
    <div class="txt">${CONFIG.about.map((p) => `<p>${esc(t(p))}</p>`).join("")}</div>
    <div class="stats">${CONFIG.stats.map((s) => `<div class="stat"><b>${esc(s.value)}</b><small>${esc(t(s.label))}</small></div>`).join("")}</div>`;
      }
      function worksBody() {
        return `<div class="gal">${CONFIG.works
          .map(
            (w, i) => `
    <button class="gi" data-w="${i}"><div class="th">${sprite("works", 48)}
      <img src="${esc(w.img)}" alt="${esc(t(w.title))}" loading="lazy" onerror="this.remove()"></div>
      <span>${esc(t(w.title))}</span><small>${esc(t(w.desc))}</small></button>`,
          )
          .join("")}</div>`;
      }
      function skillsBody() {
        return CONFIG.skills
          .map((s) => {
            const n = Math.round(s.level / 10);
            return `<div class="sk"><div class="h"><b>${esc(t(s.name))}</b><small>${s.level}%</small></div>
      <div class="blocks">${Array.from({ length: 10 }, (_, i) => `<i class="${i < n ? "on" + (i >= 7 ? " h2" : "") : ""}"></i>`).join("")}</div>
      <small style="color:var(--S);font-size:20px">${esc(t(s.note))}</small></div>`;
          })
          .join("");
      }

      const APPS = [
        {
          id: "profile",
          icon: "profile",
          c: "#3b5dc9",
          w: 440,
          body: profileBody,
        },
        {
          id: "social",
          icon: "social",
          c: "#b13e53",
          w: 420,
          body: socialBody,
        },
        { id: "about", icon: "about", c: "#257179", w: 500, body: aboutBody },
        { id: "works", icon: "works", c: "#5d275d", w: 640, body: worksBody },
        {
          id: "skills",
          icon: "skills",
          c: "#29366f",
          w: 460,
          body: skillsBody,
        },
      ];

      const desk = $("#desk");
      let z = 10,
        topId = null,
        placed = 0;

      /* --- build windows --- */
      APPS.forEach((a) => {
        const el = document.createElement("section");
        el.className = "win";
        el.id = "w-" + a.id;
        el.style.setProperty("--tc", a.c);
        el.innerHTML = `<div class="title"><span class="tt"></span><span class="ctl"><button data-min aria-label="Minimize">_</button><button data-x aria-label="Close">X</button></span></div><div class="body"></div>`;
        desk.appendChild(el);
        a.el = el;

        el.addEventListener("pointerdown", () => focusApp(a.id));
        $("[data-x]", el).onclick = () => closeApp(a.id);
        $("[data-min]", el).onclick = () => closeApp(a.id);

        const head = $(".title", el);
        head.addEventListener("pointerdown", (e) => {
          if (e.target.closest("button") || innerWidth <= 700) return;
          const ox = e.clientX - el.offsetLeft,
            oy = e.clientY - el.offsetTop;
          head.setPointerCapture(e.pointerId);
          const move = (ev) => {
            el.style.left =
              Math.max(0, Math.min(ev.clientX - ox, desk.clientWidth - 90)) +
              "px";
            el.style.top =
              Math.max(0, Math.min(ev.clientY - oy, desk.clientHeight - 50)) +
              "px";
          };
          const up = () => {
            head.removeEventListener("pointermove", move);
            head.removeEventListener("pointerup", up);
          };
          head.addEventListener("pointermove", move);
          head.addEventListener("pointerup", up);
        });
      });

      function fillApp(id) {
        const a = APPS.find((x) => x.id === id);
        $(".tt", a.el).textContent = ui(a.id).toUpperCase();
        $(".body", a.el).innerHTML = a.body();
      }
      function fillAll() {
        APPS.forEach((a) => fillApp(a.id));
      }

      function chrome() {
        $("#icons").innerHTML = APPS.map(
          (a) =>
            `<button class="dicon" data-open="${a.id}"><div class="tile">${sprite(a.icon, 44)}</div>${esc(ui(a.id))}</button>`,
        ).join("");
        $("#dock").innerHTML = APPS.map(
          (a) =>
            `<button class="dk" data-dock="${a.id}" title="${esc(ui(a.id))}" aria-label="${esc(ui(a.id))}">${sprite(a.icon, 36)}</button>`,
        ).join("");
        $("#lang").innerHTML =
          `<button data-lang="en" class="${lang === "en" ? "on" : ""}">EN</button><button data-lang="fr" class="${lang === "fr" ? "on" : ""}">FR</button>`;
        $("#bootskip").textContent = ui("skip");
        document.documentElement.lang = lang;
        refresh();
      }
      function refresh() {
        APPS.forEach((a) => {
          const d = $(`[data-dock="${a.id}"]`);
          if (d) d.classList.toggle("run", a.el.classList.contains("open"));
        });
        const cur = APPS.find(
          (a) => a.id === topId && a.el.classList.contains("open"),
        );
        $("#act").textContent = cur ? ui(cur.id).toUpperCase() : "";
      }
      function focusApp(id) {
        const a = APPS.find((x) => x.id === id);
        a.el.style.zIndex = ++z;
        topId = id;
        refresh();
      }
      function openApp(id) {
        const a = APPS.find((x) => x.id === id),
          el = a.el;
        if (innerWidth <= 700)
          APPS.forEach((o) => o.el.classList.remove("open"));
        if (!el.classList.contains("open") && !el.dataset.placed) {
          const W = Math.min(a.w, desk.clientWidth - 12);
          el.style.width = W + "px";
          const x = Math.max(
            6,
            Math.min(130 + placed * 34, desk.clientWidth - W - 6),
          );
          const y = Math.max(
            6,
            Math.min(24 + placed * 30, desk.clientHeight - 200),
          );
          el.style.left = x + "px";
          el.style.top = y + "px";
          el.dataset.placed = "1";
          placed = (placed + 1) % 6;
        }
        el.classList.add("open");
        focusApp(id);
      }
      function closeApp(id) {
        APPS.find((x) => x.id === id).el.classList.remove("open");
        refresh();
      }

      /* --- viewer (works) --- */
      const viewer = $("#viewer");
      let cur = 0;
      function openViewer(i) {
        const n = CONFIG.works.length;
        cur = (i + n) % n;
        const w = CONFIG.works[cur];
        viewer.innerHTML = `<div class="vwin"><div class="title" style="--tc:#5d275d"><span>${esc(t(w.title)).toUpperCase()}</span>
      <span class="ctl"><button data-vx aria-label="Close">X</button></span></div>
    <div class="body"><div class="vimg"><div class="ph">${sprite("works", 96)}</div></div>
      <p style="font-size:26px">${esc(t(w.desc))}</p>
      <div class="row" style="margin-top:4px"><button class="btn" data-vp>${ui("prev")}</button><button class="btn" data-vn>${ui("next")}</button>
      ${w.link ? `<a class="btn pri" href="${esc(w.link)}" target="_blank" rel="noopener">${ui("visit")}</a>` : ""}</div></div></div>`;
        const im = new Image();
        im.alt = t(w.title);
        im.onload = () => {
          const box = $(".vimg", viewer);
          if (box) {
            box.innerHTML = "";
            box.appendChild(im);
          }
        };
        im.src = w.img;
        viewer.classList.add("open");
      }
      const closeViewer = () => viewer.classList.remove("open");

      /* --- events --- */
      document.addEventListener("click", (e) => {
        const g = e.target;
        let el;
        if ((el = g.closest("[data-lang]"))) {
          lang = el.dataset.lang;
          try {
            localStorage.setItem("lang", lang);
          } catch (x) {}
          fillAll();
          chrome();
          return;
        }
        if ((el = g.closest("[data-dock]"))) {
          const a = APPS.find((x) => x.id === el.dataset.dock);
          return a.el.classList.contains("open") && topId === a.id
            ? closeApp(a.id)
            : openApp(a.id);
        }
        if ((el = g.closest("[data-open]"))) return openApp(el.dataset.open);
        if ((el = g.closest("[data-copy]"))) {
          const txt = el.dataset.copy,
            old = el.textContent;
          const done = () => {
            el.textContent = ui("copied");
            setTimeout(() => (el.textContent = ui("copy")), 1500);
          };
          try {
            navigator.clipboard.writeText(txt).then(done, done);
          } catch (x) {
            done();
          }
          return;
        }
        if ((el = g.closest("[data-w]"))) return openViewer(+el.dataset.w);
        if (g.closest("[data-vp]")) return openViewer(cur - 1);
        if (g.closest("[data-vn]")) return openViewer(cur + 1);
        if (g === viewer || g.closest("[data-vx]")) closeViewer();
      });
      document.addEventListener("keydown", (e) => {
        if (!viewer.classList.contains("open")) return;
        if (e.key === "Escape") closeViewer();
        if (e.key === "ArrowLeft") openViewer(cur - 1);
        if (e.key === "ArrowRight") openViewer(cur + 1);
      });

      /* --- clock --- */
      const tick = () =>
        ($("#clock").textContent = new Date().toLocaleTimeString(
          lang === "fr" ? "fr-FR" : "en-GB",
          { hour: "2-digit", minute: "2-digit" },
        ));
      setInterval(tick, 1000);
      tick();

      /* --- Discord live (Lanyard) --- */
      async function loadLive() {
        const d = CONFIG.discord;
        if (!d.live || !/^\d{15,25}$/.test(d.id)) return;
        try {
          const r = await fetch("https://api.lanyard.rest/v1/users/" + d.id);
          const j = await r.json();
          if (j && j.success) {
            live = j.data;
            fillApp("profile");
          }
        } catch (e) {}
      }

      /* --- boot screen --- */
      const seg = $("#seg");
      seg.innerHTML = "<i></i>".repeat(12);
      let n = 0,
        boot = $("#boot"),
        done = false;
      const iv = setInterval(() => {
        n++;
        [...seg.children].slice(0, n).forEach((b) => b.classList.add("on"));
        $("#bootp").textContent = n >= 12 ? ui("ready") : ui("boot");
        if (n >= 14) endBoot();
      }, 170);
      function endBoot() {
        if (done) return;
        done = true;
        clearInterval(iv);
        boot.classList.add("hide");
        openApp("profile");
      }
      boot.addEventListener("click", endBoot);

      fillAll();
      chrome();
      loadLive();
      setInterval(loadLive, 60000);
    </script>
  </body>
</html>
