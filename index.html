<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1c2c" />
    <title>Lyriq OS</title>
    <meta name="description" content="Portfolio of Lyriqalc" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --k: #1a1c2c;
        --w: #f4f4f4;
        --y: #ffcd75;
        --o: #ef7d57;
        --r: #b13e53;
        --p: #5d275d;
        --g: #a7f070;
        --G: #38b764;
        --t: #257179;
        --b: #3b5dc9;
        --c: #73eff7;
        --B: #41a6f6;
        --s: #94b0c2;
        --S: #566c86;
        --d: #333c57;
        --n: #29366f;
        --panel: #dfe6ee;
        --px: "Press Start 2P", "Noto Sans", "Segoe UI", sans-serif;
        --vt: "VT323", "Noto Sans", "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--k);
        color: var(--k);
        font-family: var(--vt);
        font-size: 22px;
        line-height: 1.15;
        -webkit-font-smoothing: none;
        user-select: none;
      }
      button,
      select {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .spr {
        display: block;
        image-rendering: pixelated;
      }
      img {
        image-rendering: auto;
      }
      :focus-visible {
        outline: 3px dashed var(--c);
        outline-offset: 2px;
      }

      .crt {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 99999;
        background: repeating-linear-gradient(#0000 0 3px, #0000001f 3px 4px);
      }

      /* BOOT */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--k);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        cursor: pointer;
        transition: opacity 0.4s steps(4);
        text-align: center;
        padding: 20px;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot h1 {
        font-family: var(--px);
        font-size: clamp(1.4rem, 6vw, 2.6rem);
        color: var(--y);
        text-shadow: 4px 4px 0 var(--r);
      }
      #seg {
        display: flex;
        gap: 4px;
        padding: 6px;
        border: 4px solid var(--w);
      }
      #seg i {
        width: 16px;
        height: 22px;
        background: var(--d);
      }
      #seg i.on {
        background: var(--g);
      }
      #boot p {
        font-size: 1.2rem;
        color: var(--s);
      }
      #boot .blink {
        animation: bl 1s steps(2) infinite;
      }
      @keyframes bl {
        50% {
          opacity: 0;
        }
      }

      /* TOP BAR */
      #bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 40px;
        background: var(--k);
        border-bottom: 4px solid var(--w);
        z-index: 500;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        font-family: var(--px);
        font-size: 10px;
        color: var(--w);
        gap: 10px;
      }
      #bar .brand {
        color: var(--y);
        white-space: nowrap;
      }
      #act {
        color: var(--s);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        flex: 1;
        text-align: center;
      }
      #bar .right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #langsel {
        background: var(--k);
        color: var(--w);
        border: 3px solid var(--w);
        font-family: var(--px);
        font-size: 9px;
        padding: 5px 6px;
        max-width: 130px;
      }
      #langsel option {
        font-family: sans-serif;
      }
      #tr-state {
        color: var(--y);
        font-size: 8px;
        display: none;
      }
      #tr-state.on {
        display: inline;
        animation: bl 0.8s steps(2) infinite;
      }
      #clock {
        min-width: 50px;
        text-align: right;
      }

      /* DESKTOP */
      #desk {
        position: fixed;
        inset: 40px 0 96px 0;
        overflow: hidden;
        background: linear-gradient(
          #1a1c2c 0 20%,
          #29366f 20% 38%,
          #5d275d 38% 54%,
          #b13e53 54% 70%,
          #ef7d57 70% 84%,
          #ffcd75 84% 100%
        );
      }
      #desk .stars {
        position: absolute;
        top: 30px;
        left: 30px;
        width: 4px;
        height: 4px;
        background: #fff;
        opacity: 0.9;
        box-shadow:
          120px 20px #fff,
          260px 60px #ffcd75,
          380px 10px #fff,
          520px 80px #fff,
          640px 30px #73eff7,
          780px 70px #fff,
          900px 20px #fff,
          1040px 90px #ffcd75,
          1180px 40px #fff,
          1320px 15px #fff,
          1460px 75px #73eff7,
          70px 100px #fff,
          200px 130px #fff,
          330px 150px #fff,
          470px 120px #fff,
          600px 140px #fff,
          860px 130px #fff,
          1000px 150px #fff,
          1250px 120px #fff;
        pointer-events: none;
      }
      #icons {
        position: absolute;
        inset: 0;
        padding: 18px;
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 18px;
      }
      .dicon {
        width: 104px;
        text-align: center;
        color: var(--w);
        text-shadow: 2px 2px 0 var(--k);
        font-size: 24px;
      }
      .tile {
        width: 68px;
        height: 68px;
        margin: 0 auto 6px;
        background: var(--w);
        border: 4px solid var(--k);
        box-shadow: 5px 5px 0 var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.08s steps(2);
      }
      .dicon:hover .tile {
        background: var(--y);
        transform: translate(-2px, -2px);
      }
      .dicon:active .tile {
        transform: translate(3px, 3px);
        box-shadow: 2px 2px 0 var(--k);
      }

      /* WINDOWS */
      .win {
        position: absolute;
        display: none;
        flex-direction: column;
        background: var(--w);
        border: 4px solid var(--k);
        box-shadow: 8px 8px 0 #0009;
        max-width: calc(100% - 12px);
        max-height: calc(100% - 12px);
      }
      .win.open {
        display: flex;
      }
      .title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 10px;
        background: var(--tc);
        color: var(--w);
        font-family: var(--px);
        font-size: 10px;
        cursor: grab;
        touch-action: none;
        border-bottom: 4px solid var(--k);
      }
      .title:active {
        cursor: grabbing;
      }
      .ctl {
        display: flex;
        gap: 6px;
      }
      .ctl button {
        width: 24px;
        height: 24px;
        background: var(--w);
        color: var(--k);
        border: 3px solid var(--k);
        font-family: var(--px);
        font-size: 9px;
        box-shadow: 2px 2px 0 var(--k);
      }
      .ctl button:hover {
        background: var(--y);
      }
      .ctl button:active {
        transform: translate(2px, 2px);
        box-shadow: none;
      }
      .body {
        padding: 18px;
        overflow: auto;
        user-select: text;
      }
      h2.px {
        font-family: var(--px);
        font-size: 14px;
        line-height: 1.5;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 14px;
        background: var(--y);
        color: var(--k);
        border: 4px solid var(--k);
        box-shadow: 4px 4px 0 var(--k);
        font-family: var(--px);
        font-size: 9px;
        line-height: 1.4;
        transition: transform 0.06s steps(2);
      }
      .btn:hover {
        transform: translate(-1px, -1px);
        background: #ffe0a6;
      }
      .btn:active {
        transform: translate(4px, 4px);
        box-shadow: 0 0 0 var(--k);
      }
      .btn.pri {
        background: var(--b);
        color: var(--w);
      }
      .btn.pri:hover {
        background: var(--B);
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      /* Discord card */
      .dc {
        border: 4px solid var(--k);
        background: var(--panel);
        box-shadow: 4px 4px 0 var(--k);
      }
      .banner {
        position: relative;
        height: 84px;
        background: conic-gradient(
            #3b5dc9 25%,
            #2f4ba8 0 50%,
            #3b5dc9 0 75%,
            #2f4ba8 0
          )
          0 0/16px 16px;
        border-bottom: 4px solid var(--k);
        overflow: hidden;
      }
      .banner img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .dcin {
        padding: 0 18px 18px;
      }
      .av {
        position: relative;
        width: 92px;
        height: 92px;
        margin-top: -46px;
        background: var(--s);
        border: 4px solid var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .av img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .dot {
        position: absolute;
        right: -12px;
        bottom: -12px;
        width: 24px;
        height: 24px;
        border: 4px solid var(--k);
        background: var(--S);
      }
      .s-online {
        background: var(--G);
      }
      .s-idle {
        background: var(--y);
      }
      .s-dnd {
        background: var(--r);
      }
      .s-offline {
        background: var(--S);
      }
      .dcin h2 {
        margin-top: 16px;
        font-family: var(--px);
        font-size: 14px;
        line-height: 1.4;
      }
      .hdl {
        color: var(--S);
        font-size: 24px;
      }
      .stt {
        margin-top: 8px;
        font-size: 22px;
      }
      .act {
        margin-top: 8px;
        padding: 8px 10px;
        background: var(--w);
        border: 3px solid var(--k);
        font-size: 22px;
      }
      .act small {
        display: block;
        color: var(--S);
        font-size: 18px;
      }
      .bio {
        margin-top: 12px;
        font-size: 24px;
        line-height: 1.2;
        padding: 10px;
        background: var(--w);
        border: 3px solid var(--k);
      }

      /* Social */
      .soc {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .soc a {
        display: grid;
        grid-template-columns: 52px 1fr 24px;
        gap: 14px;
        align-items: center;
        padding: 10px 14px 10px 10px;
        background: var(--w);
        border: 4px solid var(--k);
        box-shadow: 5px 5px 0 var(--k);
        transition: transform 0.06s steps(2);
      }
      .soc a:hover {
        background: var(--y);
        transform: translate(-2px, -2px);
      }
      .soc a:active {
        transform: translate(4px, 4px);
        box-shadow: 0 0 0 var(--k);
      }
      .soc .ic {
        width: 52px;
        height: 52px;
        background: var(--panel);
        border: 3px solid var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .soc b {
        display: block;
        font-family: var(--px);
        font-size: 10px;
        font-weight: 400;
        margin-bottom: 5px;
      }
      .soc small {
        font-size: 20px;
        color: var(--S);
      }
      .soc .ar {
        font-family: var(--px);
        font-size: 12px;
      }

      /* About */
      .about {
        display: flex;
        gap: 18px;
        align-items: flex-start;
      }
      .pfp {
        position: relative;
        flex: none;
        width: 108px;
        height: 108px;
        background: var(--s);
        border: 4px solid var(--k);
        box-shadow: 4px 4px 0 var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pfp img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .tag {
        padding: 2px 8px;
        background: var(--g);
        border: 3px solid var(--k);
        font-size: 20px;
      }
      .txt p {
        font-size: 24px;
        line-height: 1.2;
        margin-top: 12px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 12px;
        margin-top: 20px;
      }
      .stat {
        background: var(--panel);
        border: 3px solid var(--k);
        padding: 10px;
        text-align: center;
      }
      .stat b {
        display: block;
        font-family: var(--px);
        font-weight: 400;
        font-size: 14px;
        color: var(--r);
        margin-bottom: 8px;
      }
      .stat small {
        font-size: 20px;
        color: var(--S);
        text-transform: uppercase;
      }

      /* Works */
      .gal {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
      }
      .gi {
        display: block;
        text-align: start;
        background: var(--w);
        border: 4px solid var(--k);
        box-shadow: 4px 4px 0 var(--k);
        transition: transform 0.06s steps(2);
      }
      .gi:hover {
        transform: translate(-2px, -2px);
        background: var(--y);
      }
      .gi:active {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 var(--k);
      }
      .th {
        position: relative;
        aspect-ratio: 4/3;
        background: var(--s);
        border-bottom: 4px solid var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .th img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .gi span {
        display: block;
        padding: 8px 10px 2px;
        font-family: var(--px);
        font-size: 9px;
        line-height: 1.5;
      }
      .gi small {
        display: block;
        padding: 0 10px 8px;
        font-size: 20px;
        color: var(--S);
      }

      /* Skills */
      .sk {
        margin-bottom: 22px;
      }
      .sk .h {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
        gap: 10px;
      }
      .sk .h b {
        font-family: var(--px);
        font-weight: 400;
        font-size: 10px;
      }
      .sk .h small {
        font-size: 20px;
        color: var(--S);
      }
      .blocks {
        display: flex;
        gap: 4px;
        padding: 5px;
        background: var(--k);
      }
      .blocks i {
        flex: 1;
        height: 18px;
        background: var(--d);
      }
      .blocks i.on {
        background: var(--g);
      }
      .blocks i.on.h2 {
        background: var(--y);
      }

      /* Viewer */
      #viewer {
        position: fixed;
        inset: 0;
        z-index: 8000;
        background: #1a1c2ce6;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      #viewer.open {
        display: flex;
      }
      .vwin {
        width: min(860px, 100%);
        max-height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--w);
        border: 4px solid var(--k);
        box-shadow: 8px 8px 0 #0009;
      }
      .vwin .body {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .vimg {
        position: relative;
        background: var(--s);
        border: 4px solid var(--k);
        min-height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .vimg img {
        display: block;
        max-width: 100%;
        max-height: 52vh;
        margin: auto;
      }
      .vimg .ph {
        padding: 40px;
      }

      /* DOCK */
      #dock {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        z-index: 400;
        display: flex;
        gap: 10px;
        padding: 10px 12px 14px;
        background: var(--w);
        border: 4px solid var(--k);
        box-shadow: 6px 6px 0 #0009;
      }
      .dk {
        position: relative;
        width: 56px;
        height: 56px;
        background: var(--panel);
        border: 4px solid var(--k);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.1s steps(2);
      }
      .dk:hover {
        transform: translateY(-8px);
        background: var(--y);
      }
      .dk::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -13px;
        width: 8px;
        height: 8px;
        margin-left: -4px;
        background: var(--r);
        display: none;
      }
      .dk.run::after {
        display: block;
      }

      @media (max-width: 700px) {
        #bar {
          font-size: 8px;
        }
        #act {
          display: none;
        }
        #icons {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 16px 4px;
          flex-wrap: unset;
          align-content: start;
        }
        .dicon {
          width: auto;
        }
        .win {
          left: 6px !important;
          top: 6px !important;
          width: calc(100% - 12px) !important;
        }
        .title {
          cursor: default;
        }
        .about {
          flex-direction: column;
        }
        .dk {
          width: 50px;
          height: 50px;
        }
        #dock {
          gap: 8px;
          padding: 8px 10px 14px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .blink,
        #tr-state.on {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <h1>LYRIQ OS</h1>
      <div id="seg"></div>
      <p id="bootp">Booting…</p>
      <p class="blink" id="bootskip">click to skip</p>
    </div>

    <div id="bar">
      <span class="brand">LYRIQ OS</span>
      <span id="act"></span>
      <span class="right">
        <span id="tr-state">…</span>
        <select id="langsel" aria-label="Language"></select>
        <span id="clock">--:--</span>
      </span>
    </div>

    <div id="desk">
      <div class="stars"></div>
      <div id="icons"></div>
    </div>
    <div id="dock"></div>
    <div id="viewer"></div>
    <div class="crt"></div>

    <script>
      /* =========================================================

          },

          },
          {
            icon: "mail",
            label: "Email",
            handle: "you@email.com",
            url: "mailto:you@email.com",
          },
        ],

        tags: ["Building", "UI Designing"],
        about: [
          "Hey! I'm lyriqalc! A French Roblox Developer. Currently working on a project called 'Banff, Alberta'.",
          "I love working on multiple projects, but it takes some time! I'm also looking for developers to help me with Banff!",
        ],
        stats: [
          { value: "10+", label: "Projects" },
          { value: "2023", label: "Since" },
          { value: "16", label: "Age" },
        ],

        skills: [
          {
            name: "Building",
            note: "I can build simple things, but not very hard things.",
            level: 70,
          },
          {
            name: "UI Designing",
            note: "I can design simple UIs using Figma/Roblox Studio. I can also design UIs based on a request.",
            level: 70,

      const $ = (s, r = document) => r.querySelector(s);

          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const store = {
        get(k) {
          try {
            return localStorage.getItem(k);
          } catch (e) {

      /* ---------- Translation (Google Translate) ---------- */
      const CODES = LANGS.map((l) => l[0]);
      let lang = "en";
      let dict = {};
      let trToken = 0;

      function detectLang() {
        const saved = store.get("lang");
        if (saved && CODES.includes(saved)) return saved;
        const nav = (navigator.language || "en").toLowerCase();
        return (
          CODES.find((c) => c.toLowerCase() === nav) ||
          CODES.find((c) => c.toLowerCase() === nav.split("-")[0]) ||
          "en"
        );
      }

      function sourceStrings() {
        const set = new Set(Object.values(UI));
        const add = (s) => s && set.add(String(s));
        add(CONFIG.role);
        add(CONFIG.discord.bio);
        CONFIG.socials.forEach((s) => add(s.label));
        CONFIG.tags.forEach(add);
        CONFIG.about.forEach(add);
        CONFIG.stats.forEach((s) => add(s.label));
        CONFIG.skills.forEach((s) => (add(s.name), add(s.note)));
        CONFIG.works.forEach((w) => (add(w.title), add(w.desc)));
        return [...set].filter((s) => /[A-Za-z]{2}/.test(s));
      }

      async function googleTranslate(text, to) {
        const url =
          "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&dt=t&tl=" +
          encodeURIComponent(to) +
          "&q=" +
          encodeURIComponent(text);
        const r = await fetch(url);
        if (!r.ok) throw new Error("HTTP " + r.status);
        const j = await r.json();
        return j[0].map((x) => x[0]).join("");
      }

      const t = (s) => {
        if (s == null || s === "") return "";
        if (lang === "en") return s;
        return (OVERRIDES[lang] && OVERRIDES[lang][s]) || dict[s] || s;
      };
      const ui = (k) => t(UI[k]);

      async function setLang(l) {
        lang = l;
        store.set("lang", l);
        const token = ++trToken;
        document.documentElement.lang = l;
        document.documentElement.dir = "ltr";
        dict = {};
        if (l !== "en") {
          try {
            dict = JSON.parse(store.get("tr_" + l) || "{}");
          } catch (e) {}
        }
        render();
        if (l === "en") return;

        const todo = sourceStrings().filter(
          (s) => !dict[s] && !(OVERRIDES[l] && OVERRIDES[l][s]),
        );
        if (!todo.length) return;
        const flag = $("#tr-state");
        flag.classList.add("on");
        let i = 0;
        const worker = async () => {
          while (i < todo.length && token === trToken) {
            const s = todo[i++];
            try {
              dict[s] = await googleTranslate(s, l);
            } catch (e) {}
          }
        };
        await Promise.all([worker(), worker(), worker(), worker()]);
        if (token !== trToken) return;
        flag.classList.remove("on");
        store.set("tr_" + l, JSON.stringify(dict));
        render();
      }

      /* ---------- Discord (Lanyard + Discord Lookup fallback) ---------- */
      let live = null;
      let lookup = null;

      async function loadDiscord() {
        const d = CONFIG.discord;
        if (!d.live || !/^\d{15,25}$/.test(d.id)) return;
        try {
          const r = await fetch("https://api.lanyard.rest/v1/users/" + d.id);
          const j = await r.json();
          if (j && j.success) live = j.data;
        } catch (e) {}
        if (!lookup) {
          try {
            const r = await fetch(
              "https://discordlookup.mesalytic.moe/v1/user/" + d.id,
            );
            if (r.ok) lookup = await r.json();
          } catch (e) {}
        }
        if (live || lookup) fillApp("profile");
      }

      function profileData() {
        const d = CONFIG.discord;
        const u = live && live.discord_user;
        const name =
          (u && (u.global_name || u.username)) ||
          (lookup && (lookup.global_name || lookup.username)) ||
          d.displayName;
        const handle =
          (u && u.username) || (lookup && lookup.username) || d.username;
        let avatar = d.avatar;
        if (u && u.avatar)
          avatar = `https://cdn.discordapp.com/avatars/${d.id}/${u.avatar}.png?size=256`;
        else if (lookup && lookup.avatar && lookup.avatar.link)
          avatar = lookup.avatar.link;
        const banner = lookup && lookup.banner && lookup.banner.link;
        const acts = (live && live.activities) || [];
        return {
          name,
          handle,
          avatar,
          banner,
          status: live ? live.discord_status : "offline",
          custom: acts.find((a) => a.type === 4),
          game: acts.find((a) => a.type === 0),
          spotify: live && live.listening_to_spotify ? live.spotify : null,
        };
      }

      const APPS = [

        const head = $(".title", el);

          if (e.target.closest("button") || innerWidth <= 700) return;
          const ox = e.clientX - el.offsetLeft,
            oy = e.clientY - el.offsetTop;
          head.setPointerCapture(e.pointerId);
          const move = (ev) => {
            el.style.left =
              Math.max(0, Math.min(ev.clientX - ox, desk.clientWidth - 90)) +
              "px";
            el.style.top =
              Math.max(0, Math.min(ev.clientY - oy, desk.clientHeight - 50)) +
              "px";
          };
          const up = () => {
            head.removeEventListener("pointermove", move);
            head.removeEventListener("pointerup", up);
          };
          head.addEventListener("pointermove", move);
          head.addEventListener("pointerup", up);
        });
      });

        const a = APPS.find((x) => x.id === id);

        $("#dock").innerHTML = APPS.map(

      function refresh() {
        APPS.forEach((a) => {
          const d = $(`[data-dock="${a.id}"]`);
          if (d) d.classList.toggle("run", a.el.classList.contains("open"));
        });
        const cur = APPS.find(

      function focusApp(id) {
        const a = APPS.find((x) => x.id === id);
        a.el.style.zIndex = ++z;

        refresh();
      }
      function openApp(id) {
        const a = APPS.find((x) => x.id === id),
          el = a.el;
        if (innerWidth <= 700)
          APPS.forEach((o) => o.el.classList.remove("open"));
        if (!el.classList.contains("open") && !el.dataset.placed) {
          const W = Math.min(a.w, desk.clientWidth - 12);
          el.style.width = W + "px";
          const x = Math.max(
            6,
            Math.min(130 + placed * 34, desk.clientWidth - W - 6),
          );
          const y = Math.max(
            6,
            Math.min(24 + placed * 30, desk.clientHeight - 200),
          );
          el.style.left = x + "px";
          el.style.top = y + "px";
          el.dataset.placed = "1";
          placed = (placed + 1) % 6;
        }
        el.classList.add("open");
        focusApp(id);

        const im = new Image();
        im.alt = t(w.title);

      /* ---------- Events ---------- */

        const g = e.target;
        let el;
        if ((el = g.closest("[data-dock]"))) {
          const a = APPS.find((x) => x.id === el.dataset.dock);
          return a.el.classList.contains("open") && topId === a.id
            ? closeApp(a.id)
            : openApp(a.id);
        }
        if ((el = g.closest("[data-open]"))) return openApp(el.dataset.open);
        if ((el = g.closest("[data-copy]"))) {
          const txt = el.dataset.copy;
          const done = () => {
            el.textContent = ui("copied");
            setTimeout(() => (el.textContent = ui("copy")), 1500);
          };
          try {
            navigator.clipboard.writeText(txt).then(done, done);
          } catch (x) {
            done();
          }
          return;
        }
        if ((el = g.closest("[data-w]"))) return openViewer(+el.dataset.w);
        if (g.closest("[data-vp]")) return openViewer(cur - 1);
        if (g.closest("[data-vn]")) return openViewer(cur + 1);
        if (g === viewer || g.closest("[data-vx]")) closeViewer();
      });
      document.addEventListener("keydown", (e) => {
        if (viewer.classList.contains("open")) {
          if (e.key === "Escape") closeViewer();
          if (e.key === "ArrowLeft") openViewer(cur - 1);
          if (e.key === "ArrowRight") openViewer(cur + 1);
          return;
        }
        if (e.key === "Escape" && topId) closeApp(topId);
      });

      /* ---------- Clock ---------- */
      function tick() {
        let txt;
        try {
          txt = new Date().toLocaleTimeString(lang, {
            hour: "2-digit",
            minute: "2-digit",
          });
        } catch (e) {
          txt = new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
          });
        }
        $("#clock").textContent = txt;
      }
      setInterval(tick, 1000);

      /* ---------- Boot ---------- */
      const seg = $("#seg");
      seg.innerHTML = "<i></i>".repeat(12);
      let n = 0,
        done = false;
      const boot = $("#boot");
      const iv = setInterval(() => {
        n++;
        [...seg.children].slice(0, n).forEach((b) => b.classList.add("on"));
        $("#bootp").textContent = n >= 12 ? ui("ready") : ui("boot");
        if (n >= 14) endBoot();
      }, 170);
      function endBoot() {
        if (done) return;
        done = true;
        clearInterval(iv);
        boot.classList.add("hide");
        openApp("profile");
      }
      boot.addEventListener("click", endBoot);

      /* ---------- Start ---------- */
      setLang(detectLang());
      loadDiscord();
      setInterval(loadDiscord, 60000);
    </script>
  </body>
</html>
